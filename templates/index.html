<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <header class="hero">
            <div>
                <p class="eyebrow">AI POWERED LEARNING</p>

                <h1>EduGenie</h1>

                <p class="subtitle">
                    Your personal AI learning assistant for explanations,
                    questions, quizzes, summaries, and learning paths.
                </p>
            </div>
        </header>


        <section class="card">

            <label for="task">Choose a task</label>

            <select id="task">
                <option value="qa">Q&amp;A</option>
                <option value="explain">Explain Concept</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize</option>
                <option value="learn">Recommend Learning Path</option>
            </select>


            <label for="inputText">
                Enter your question or topic
            </label>

            <textarea
                id="inputText"
                rows="10"
                placeholder="Ask a question or enter a topic..."
            ></textarea>


            <div class="actions">

                <button id="generateBtn" class="primary">
                    Generate
                </button>

                <button id="clearBtn" class="secondary">
                    Clear
                </button>

            </div>


            <p id="status" class="status"></p>

        </section>


        <section class="card result-card">

            <div class="result-header">
                <h2>Result</h2>
            </div>

            <div id="result" class="result">
                Your AI-generated result will appear here.
            </div>

        </section>

    </main>


    <script src="/static/app.js"></script>

</body>
</html>
